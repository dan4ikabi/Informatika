<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>11В Информатика нәтижелері</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Layout: оқушылар тізімі сол жақта, таңдалған оқушының карточкасы оң жақта; телефонда тізім жоғарыда */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#18233A; --muted:#5D6880; --line:#D9DFEA;
  --accent:#2B4C7E; --accent-soft:#E3EAF5; --good:#1E7B4A; --good-soft:#E3F2EA;
  --warn:#9A6200; --warn-soft:#FBF0D9; --none:#8A93A6; --none-soft:#EEF0F4;
  --barA:#A9BCD8; --barB:#2B4C7E; --avg:#C2410C;
  --f-display:"PT Serif",Georgia,serif; --f-body:"PT Sans","Segoe UI",Arial,sans-serif; --f-num:"PT Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#172034; --ink:#E6EBF4; --muted:#9AA6BD; --line:#2A3650;
  --accent:#8FB0E3; --accent-soft:#22314D; --good:#5CC48C; --good-soft:#163428;
  --warn:#E5AE4E; --warn-soft:#3A2E14; --none:#8A93A6; --none-soft:#222B3D;
  --barA:#45597A; --barB:#8FB0E3; --avg:#F08A4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#172034; --ink:#E6EBF4; --muted:#9AA6BD; --line:#2A3650;
  --accent:#8FB0E3; --accent-soft:#22314D; --good:#5CC48C; --good-soft:#163428;
  --warn:#E5AE4E; --warn-soft:#3A2E14; --none:#8A93A6; --none-soft:#222B3D;
  --barA:#45597A; --barB:#8FB0E3; --avg:#F08A4B; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header h1{font-family:var(--f-display);font-size:clamp(22px,3.4vw,30px);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:2px}
.list h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 10px 6px;font-weight:700}
.st{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;font-size:15px}
.st:hover{background:var(--accent-soft)}
.st:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.st[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.st[aria-selected="true"] .pill{background:var(--surface);color:var(--accent)}
.pill{font-family:var(--f-num);font-size:12px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
@media (max-width:760px){.list{display:flex;flex-wrap:wrap;gap:6px;padding:10px}.list h2{width:100%;margin:0 2px 2px}.st{border:1px solid var(--line);padding:6px 10px;font-size:14px}.st .pill{display:none}}
.card{min-width:0;display:grid;gap:18px}
.who{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.who h2{font-family:var(--f-display);font-size:clamp(22px,3vw,28px);margin:0;line-height:1.2}
.who span{color:var(--muted);font-size:14px}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.tests{grid-template-columns:1fr}}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h h3{margin:0;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.b-good{background:var(--good-soft);color:var(--good)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-none{background:var(--none-soft);color:var(--none)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{display:grid;gap:2px}
.num small{font-size:12px;color:var(--muted)}
.num b{font-family:var(--f-num);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.num b i{font-style:normal;font-size:13px;color:var(--muted)}
.up{color:var(--good)} .down{color:#B42318} .flat{color:var(--muted)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.track{position:relative;height:16px;background:var(--bg);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:4px}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--avg)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:2px;height:12px;background:var(--avg)}
.txt{margin:0;font-size:15px;max-width:62ch}
.rec{margin:0;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.rec strong{color:var(--ink)}
.missing{color:var(--muted);font-size:14px;margin:0}
footer{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style></head><body>

<div class="wrap">
  <header>
    <h1>11В сыныбы · Информатика нәтижелері</h1>
    <p>Dostyq School Kyzylorda · БС-0, БС-1, ПҚС-1, ПҚС-2 · максимал балл — 50. Оқушының аты-жөнін басыңыз.</p>
  </header>
  <div class="layout">
    <nav class="list" id="list" role="tablist" aria-label="Оқушылар"><h2>Оқушылар</h2></nav>
    <main class="card" id="card" aria-live="polite"></main>
  </div>
  <footer>Сынып орташасы (50-ден): БС-0 — 22.2, БС-1 — 32.0, ПҚС-1 — 28.9, ПҚС-2 — 39.3. «—» — сынақты тапсырмаған.</footer>
</div>

<script>
const AVG={bs0:22.2,bs1:32.0,p1:28.9,p2:39.3};
const S=[
 {n:"Алиева Адина",bs:[27,40],pq:[31,45],
  bsT:"Жақсы өсім (+13), жоғары деңгейге шықты. БС-1-де сынып орташасынан 8 балл жоғары.",
  bsR:"Дайындық қарқынын сақтау, күрделі тапсырмаларға көшу.",
  pqT:"ПҚС-2-де сыныптағы ең жоғары балл (45, яғни 90%). ПҚС-1-ден кейін 14 балға өсті.",
  pqR:"Осы деңгейді тұрақты сақтау, мақсат — 45+."},
 {n:"Қайрақбай Ернұр",bs:[30,41],pq:[39,44],
  bsT:"БС-1-де сыныптағы ең жоғары балл (41). Өсімі +11.",
  bsR:"Қате жіберген тақырыптарды жабу, мақсат — 45+.",
  pqT:"Екі сынақта да жоғары деңгей (39 және 44), ең тұрақты оқушылардың бірі.",
  pqR:"Күрделі есептерді пысықтап, 45+ балға шығу."},
 {n:"Мұратбек Бекарыс",bs:[23,40],pq:[31,43],
  bsT:"БС бойынша сыныптағы ең көп өсім (+17). Орта деңгейден жоғары деңгейге көтерілді.",
  bsR:"Жеткен деңгейді бекіту.",
  pqT:"Айтарлықтай өсім (+12), жоғары топқа шықты. Нәтижесі сынақтан сынаққа ауытқиды.",
  pqR:"Тұрақтылыққа жұмыс істеу: әр сынақта 40+ сақтау."},
 {n:"Қуанышбек Мухаммад",bs:[32,38],pq:[40,40],
  bsT:"БС-0-де ең жоғары балл алған, бірақ өсімі ең аз (+6).",
  bsR:"40-тан асу үшін қателерді жеке талдау.",
  pqT:"Екі сынақта да 40 балл: деңгейі жоғары, бірақ өсім жоқ.",
  pqR:"45-ке шығу үшін күрделі тапсырмаларды пысықтау."},
 {n:"Сахи Сейфулла",bs:[19,26],pq:[22,37],
  bsT:"Өсімі баяу (+7), деңгейі тең жартыдан сәл жоғары.",
  bsR:"Дайындықты күшейту, аптасына 2–3 рет тест шешу.",
  pqT:"ПҚС бойынша сыныптағы ең көп өсім (+15). 40-қа жақындап қалды.",
  pqR:"Қарқынды сақтап, 40+ балға шығу."},
 {n:"Бақберген Санжар",bs:[15,25],pq:[24,36],
  bsT:"Жақсы өсім (+10), бірақ әлі 50% деңгейінде.",
  bsR:"Базалық тақырыптарды бекіту.",
  pqT:"Жақсы өсім (+12), 36 балл.",
  pqR:"Әлсіз тақырыптарды жауып, 40-қа жету."},
 {n:"Асқарқызы Бибіхадиша",bs:[12,24],pq:[null,40],
  bsT:"Балын екі есеге арттырды (12 → 24). Бағыты дұрыс.",
  bsR:"Жүйелі дайындықты жалғастыру, мақсат — 30+.",
  pqT:"ПҚС-1-ге қатыспаған. ПҚС-2-де 40 балл, бұл жоғары деңгей.",
  pqR:"Бұл нәтижені келесі сынақтарда бекіту."},
 {n:"Назым Ерқанат",bs:[10,22],pq:[18,29],
  bsT:"Балы екі еседен көп өсті (+12), бірақ БС-1-дегі ең төмен нәтиже.",
  bsR:"Негізгі тақырыптарға қосымша көңіл бөлу.",
  pqT:"Өсімі жақсы (+11), бірақ екі сынақта да сыныптағы ең төмен нәтиже.",
  pqR:"Базалық тақырыптарды қайталау және жеке бақылау."},
 {n:"Нұрғалиева Айгерім",bs:[32,null],pq:[null,40],
  bsT:"БС-0-де ең жоғары балл алғандардың бірі (32), бірақ БС-1-ге қатыспаған.",
  bsR:"Сынақтарға тұрақты қатысу.",
  pqT:"ПҚС-1-ге қатыспаған. ПҚС-2-де 40 балл, бұл жоғары деңгей.",
  pqR:"Келесі сынақтарға міндетті түрде қатысу."},
 {n:"Рақыш Дінмұхамед",bs:null,pq:[26,null],
  bsT:"",bsR:"",
  pqT:"ПҚС-1-де 26 балл (орта деңгей), ПҚС-2-ге қатыспаған.",
  pqR:"Келесі сынақтарға қатысуын қамтамасыз ету."}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const latest=s=>{const a=[...(s.pq||[]),...(s.bs?[]:[])].filter(v=>v!=null);const p=s.pq&&s.pq[1]!=null?s.pq[1]:null;return p!=null?p:(s.pq&&s.pq[0]!=null?s.pq[0]:null)};
function badge(v,hi){if(v==null)return'<span class="badge b-none">тапсырмаған</span>';return v>=hi?'<span class="badge b-good">Жоғары деңгей</span>':v>=30?'<span class="badge b-warn">Орта деңгей</span>':'<span class="badge b-warn">Қолдау қажет</span>'}
function delta(a,b){if(a==null||b==null)return'<b class="flat">—</b>';const d=b-a;return`<b class="${d>0?'up':d<0?'down':'flat'}">${d>0?'▲ +':d<0?'▼ ':'■ '}${d}</b>`}
function bar(label,v,avg,cls){const w=v==null?0:v/50*100;return`<div class="bar"><span>${label}</span><div class="track" title="${label}: ${v==null?'тапсырмаған':v+' / 50'}; сынып орташасы ${avg}"><div class="fill" style="width:${w}%;background:var(${cls})"></div><div class="tick" style="left:calc(${avg/50*100}% - 1px)"></div></div></div>`}
function section(title,labels,vals,avgs,txt,rec,hi){
  if(!vals)return`<section class="sec"><div class="sec-h"><h3>${title}</h3><span class="badge b-none">дерек жоқ</span></div><p class="missing">Бұл оқушы ${title.split(' ')[0]} сынақтарының тізімінде жоқ.</p></section>`;
  const [a,b]=vals;const last=b!=null?b:null;
  return`<section class="sec">
   <div class="sec-h"><h3>${title}</h3>${badge(last,hi)}</div>
   <div class="nums">
     <div class="num"><small>${labels[0]}</small><b>${a??'—'}${a!=null?'<i> /50</i>':''}</b></div>
     <div class="num"><small>${labels[1]}</small><b>${b??'—'}${b!=null?'<i> /50</i>':''}</b></div>
     <div class="num"><small>Өзгеріс</small>${delta(a,b)}</div>
   </div>
   <div class="bars">${bar(labels[0],a,avgs[0],'--barA')}${bar(labels[1],b,avgs[1],'--barB')}
     <div class="legend"><i></i> сынып орташасы: ${labels[0]} — ${avgs[0]}, ${labels[1]} — ${avgs[1]}</div></div>
   <p class="txt">${esc(txt)}</p>
   <p class="rec"><strong>Ұсыныс:</strong> ${esc(rec)}</p>
  </section>`}
const list=document.getElementById('list'),card=document.getElementById('card');
S.forEach((s,i)=>{const b=document.createElement('button');b.className='st';b.id='st'+i;b.setAttribute('role','tab');
  const p=latest(s);b.innerHTML=`<span>${esc(s.n)}</span><span class="pill">${p??'—'}</span>`;b.onclick=()=>show(i);list.appendChild(b)});
function show(i){const s=S[i];
  list.querySelectorAll('.st').forEach((b,k)=>b.setAttribute('aria-selected',k===i));
  card.innerHTML=`<div class="who"><h2>${esc(s.n)}</h2><span>11В · бейіндік пән: Информатика</span></div>
   <div class="tests">${section('БС талдауы',['БС-0','БС-1'],s.bs,[AVG.bs0,AVG.bs1],s.bsT,s.bsR,38)}${section('ПҚС талдауы',['ПҚС-1','ПҚС-2'],s.pq,[AVG.p1,AVG.p2],s.pqT,s.pqR,40)}</div>`;
  try{localStorage.setItem('sel',i)}catch(e){}}
let start=0;try{const v=+localStorage.getItem('sel');if(v>=0&&v<S.length)start=v}catch(e){}
show(start);
</script>
</body></html>
